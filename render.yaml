services:
  - type: web
    name: ozeret-reut-whatsapp
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: GREEN_API_URL
        sync: false
      - key: GREEN_API_INSTANCE
        sync: false
      - key: GREEN_API_TOKEN
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: LLM_MODEL
        value: claude-haiku-4-5-20251001
      - key: MAX_HISTORY
        value: "20"
      - key: DATABASE_PATH
        value: /data/conversations.db
    disk:
      name: data
      mountPath: /data
      sizeGB: 1
